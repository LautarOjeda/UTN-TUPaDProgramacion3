<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro - UTN</title>
</head>
<body>
    <header>
        <h1>Formulario de Registro</h1>
        <p>Completá tus datos para crear una cuenta.</p>
    </header>

    <main>
        <form action="#" method="post">
            <!-- 1. Nombre completo -->
            <div>
                <label for="nombre">Nombre completo:</label><br>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre" 
                    placeholder="Ej: Juan Pérez" 
                    required 
                    tabindex="1"
                >
            </div>
            <br>

            <!-- 2. Correo electrónico -->
            <div>
                <label for="email">Correo electrónico:</label><br>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Ej: correo@ejemplo.com" 
                    required 
                    tabindex="2"
                >
            </div>
            <br>

            <!-- 3. Contraseña -->
            <div>
                <label for="password">Contraseña:</label><br>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Mínimo 8 caracteres" 
                    minlength="8" 
                    required 
                    tabindex="3"
                >
            </div>
            <br>

            <!-- 4. Selección de género (radio) -->
            <fieldset>
                <legend>Género:</legend>
                
                <input type="radio" id="masculino" name="genero" value="masculino" required tabindex="4">
                <label for="masculino">Masculino</label><br>

                <input type="radio" id="femenino" name="genero" value="femenino" tabindex="5">
                <label for="femenino">Femenino</label><br>

                <input type="radio" id="otro" name="genero" value="otro" tabindex="6">
                <label for="otro">Otro</label>
            </fieldset>
            <br>

            <!-- 5. Intereses (checkbox) -->
            <fieldset>
                <legend>Intereses:</legend>

                <input type="checkbox" id="musica" name="intereses" value="musica" tabindex="7">
                <label for="musica">Música</label><br>

                <input type="checkbox" id="deporte" name="intereses" value="deporte" tabindex="8">
                <label for="deporte">Deporte</label><br>

                <input type="checkbox" id="lectura" name="intereses" value="lectura" tabindex="9">
                <label for="lectura">Lectura</label><br>

                <input type="checkbox" id="programacion" name="intereses" value="programacion" tabindex="10">
                <label for="programacion">Programación</label>
            </fieldset>
            <br>

            <!-- 6. Comentarios adicionales (textarea) -->
            <div>
                <label for="comentarios">Comentarios adicionales:</label><br>
                <textarea 
                    id="comentarios" 
                    name="comentarios" 
                    rows="4" 
                    cols="40" 
                    placeholder="Escribí aquí tus comentarios o consultas..." 
                    tabindex="11"
                ></textarea>
            </div>
            <br>

            <!-- 7. País (select) -->
            <div>
                <label for="pais">País:</label><br>
                <select id="pais" name="pais" required tabindex="12">
                    <option value="" disabled selected>Seleccioná tu país</option>
                    <option value="argentina">Argentina</option>
                    <option value="brasil">Brasil</option>
                    <option value="chile">Chile</option>
                    <option value="uruguay">Uruguay</option>
                </select>
            </div>
            <br>

            <!-- 8. Botón de envío -->
            <div>
                <button type="submit" tabindex="13">Registrarse</button>
            </div>
        </form>
    </main>
</body>
